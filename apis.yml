apis:
- name: Tridge Data & Analytics API
  description: 'Tridge advertises a commercial API for integrating its global agri-food
    price and trade data into a customer''s own systems ("the most comprehensive and
    powerful API to allow you to integrate our global price data and real-time insights
    into your business or application with ease" — tridge.com/about/data-analytics/price).
    No public developer portal, reference documentation, OpenAPI/AsyncAPI contract
    or self-serve signup was found; the published call to action is a sales enquiry
    form. A GraphQL endpoint backing the web application exists at api.tridge.com/graphql
    but returns HTTP 403 ("crc rejected") to anonymous callers, and www.tridge.com/robots.txt
    disallows /graphql and /api/ for all crawlers. baseURL is deliberately omitted:
    Tridge does not publish one, and guessing it from the domain would be fabrication.'
  humanURL: https://www.tridge.com/about/data-analytics/price
