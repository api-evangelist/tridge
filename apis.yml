aid: tridge
name: Tridge
description: 'Tridge is a South Korea-headquartered global agri-food trade intelligence
  and sourcing platform. It combines a data layer of structured cross-border trade,
  price, production, seasonality and weather data (the company cites 682M+ trade data
  points and 65M+ price records across 200+ markets), a network layer of verified
  buyers and suppliers in 190+ countries, and an AI layer that runs trade workflows
  from discovery through deal closure. Products include Market Curations, Sourcing
  Hub, Data & Analytics, Tridge Eye (market intelligence) and Tridge Ark (AI-driven
  export sales outreach). Tridge advertises an API for integrating its global price
  and trade data into customer systems, but publishes no public developer portal,
  reference documentation or machine-readable contract — access is arranged through
  a sales conversation.'
